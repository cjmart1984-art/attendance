<!DOCTYPE html>
<html lang="ko">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR 출근 인증</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f6f7f9;
      color: #111827;
    }
    .wrap {
      max-width: 560px;
      margin: 0 auto;
      padding: 20px;
    }
    .card {
      background: #fff;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }
    h1 {
      font-size: 24px;
      margin: 0 0 6px;
    }
    .sub {
      color: #6b7280;
      margin-bottom: 20px;
      font-size: 14px;
    }
    label {
      display: block;
      margin: 14px 0 6px;
      font-weight: 700;
      font-size: 14px;
    }
    select, input, textarea, button {
      width: 100%;
      box-sizing: border-box;
      font-size: 16px;
      border-radius: 12px;
      border: 1px solid #d1d5db;
      padding: 12px;
      background: #fff;
    }
    textarea {
      min-height: 80px;
      resize: vertical;
    }
    button {
      margin-top: 18px;
      background: #111827;
      color: #fff;
      border: none;
      font-weight: 800;
      cursor: pointer;
    }
    button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }
    .notice {
      background: #f3f4f6;
      border-radius: 12px;
      padding: 12px;
      font-size: 13px;
      color: #374151;
      line-height: 1.5;
      margin-top: 14px;
    }
    .result {
      margin-top: 16px;
      padding: 14px;
      border-radius: 12px;
      display: none;
      line-height: 1.6;
      white-space: pre-line;
    }
    .ok { background: #ecfdf5; color: #065f46; }
    .warn { background: #fffbeb; color: #92400e; }
    .err { background: #fef2f2; color: #991b1b; }
    .row {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      margin-top: 12px;
    }
    .row input[type="checkbox"] {
      width: auto;
      margin-top: 3px;
    }
    .row span {
      font-size: 13px;
      color: #374151;
      line-height: 1.5;
    }
    .small {
      font-size: 12px;
      color: #6b7280;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>QR 출근 인증</h1>
      <div class="sub" id="siteName">불러오는 중...</div>

      <label for="employee">성명</label>
      <select id="employee">
        <option value="">직원을 선택하세요</option>
      </select>

      <label for="pin">휴대폰 뒷자리 4자리</label>
      <input id="pin" type="password" maxlength="4" inputmode="numeric" pattern="[0-9]*" placeholder="예: 1234">

      <label for="workDefault">오늘 업무</label>
      <input id="workDefault" type="text" value="기본 업무 수행">

      <label for="workDetail">상세 업무 내용</label>
      <textarea id="workDetail" placeholder="필요 시 상세 내용을 입력하세요."></textarea>

      <div class="notice">
        위치정보는 출근 인증 시점에만 1회 수집됩니다. 실시간 추적은 하지 않습니다.
        출근 기록과 위치정보는 수집일로부터 1년간 보관 후 정리됩니다.
      </div>

      <div class="row">
        <input id="consent" type="checkbox">
        <span>
          개인정보 및 위치정보 수집·이용에 동의합니다.
          수집 항목: 성명, 부서, 팀, 구역, 휴대폰 뒷자리 PIN 확인 결과, 출근 시간, GPS 위치정보, 기기정보, 업무 내용.
        </span>
      </div>

      <button id="checkBtn" onclick="startCheckIn()">위치 확인 후 출근하기</button>

      <div id="result" class="result"></div>

      <div class="small">
        GPS 오류가 발생하면 브라우저 위치 권한을 허용한 뒤 다시 시도하세요.
      </div>
    </div>
  </div>

  <script>
    let appData = null;

    window.addEventListener('load', function() {
      google.script.run
        .withSuccessHandler(function(data) {
          appData = data;
          document.getElementById('siteName').textContent =
            (data.config.site_name || '사업장') + ' / ' + data.today;
          fillEmployees(data.employees || []);
        })
        .withFailureHandler(function(err) {
          showResult('시스템 초기 데이터를 불러오지 못했습니다.\n' + err.message, 'err');
        })
        .getPublicData();
    });

    function fillEmployees(employees) {
      const sel = document.getElementById('employee');
      employees.forEach(function(emp) {
        const opt = document.createElement('option');
        opt.value = emp.employee_id;
        opt.textContent = [emp.name, emp.department, emp.team, emp.zone]
          .filter(Boolean).join(' / ');
        sel.appendChild(opt);
      });
    }

    function startCheckIn() {
      const employeeId = document.getElementById('employee').value;
      const pin = document.getElementById('pin').value.trim();
      const consent = document.getElementById('consent').checked;

      if (!employeeId) return showResult('직원을 선택하세요.', 'err');
      if (!/^\d{4}$/.test(pin)) return showResult('휴대폰 뒷자리 4자리를 입력하세요.', 'err');
      if (!consent) return showResult('개인정보 및 위치정보 수집·이용 동의가 필요합니다.', 'err');

      setLoading(true);
      showResult('위치 정보를 확인하는 중입니다...', 'warn');

      if (!navigator.geolocation) {
        submitCheckIn(null, null, null);
        return;
      }

      navigator.geolocation.getCurrentPosition(
        function(pos) {
          submitCheckIn(
            pos.coords.latitude,
            pos.coords.longitude,
            pos.coords.accuracy
          );
        },
        function() {
          submitCheckIn(null, null, null);
        },
        {
          enableHighAccuracy: true,
          timeout: 12000,
          maximumAge: 0
        }
      );
    }

    function submitCheckIn(lat, lng, accuracy) {
      const payload = {
        employee_id: document.getElementById('employee').value,
        pin: document.getElementById('pin').value.trim(),
        work_default: document.getElementById('workDefault').value.trim(),
        work_detail: document.getElementById('workDetail').value.trim(),
        lat: lat,
        lng: lng,
        accuracy: accuracy,
        consent_agreed: document.getElementById('consent').checked,
        device_info: navigator.userAgent
      };

      google.script.run
        .withSuccessHandler(function(res) {
          setLoading(false);

          if (res.ok) {
            showResult(
              '출근 완료\n' +
              '상태: ' + res.status + '\n' +
              'GPS: ' + res.gps_result + '\n' +
              '사업장 거리: ' + (res.distance_from_site || '-') + 'm',
              'ok'
            );
          } else if (res.pending) {
            showResult(
              res.message + '\n' +
              '상태: ' + res.status + '\n' +
              'GPS: ' + res.gps_result + '\n' +
              '사업장 거리: ' + (res.distance_from_site || '-') + 'm',
              'warn'
            );
          } else if (res.duplicate) {
            showResult(res.message, 'warn');
          } else {
            showResult(res.message || '출근 처리에 실패했습니다.', 'err');
          }
        })
        .withFailureHandler(function(err) {
          setLoading(false);
          showResult('출근 처리 중 오류가 발생했습니다.\n' + err.message, 'err');
        })
        .checkIn(payload);
    }

    function setLoading(isLoading) {
      const btn = document.getElementById('checkBtn');
      btn.disabled = isLoading;
      btn.textContent = isLoading ? '처리 중...' : '위치 확인 후 출근하기';
    }

    function showResult(msg, type) {
      const box = document.getElementById('result');
      box.className = 'result ' + type;
      box.style.display = 'block';
      box.textContent = msg;
    }
  </script>
</body>
</html>
