<!DOCTYPE html>
<html lang="ko">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>근태 관리자</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f6f7f9;
      color: #111827;
    }
    .wrap {
      max-width: 1180px;
      margin: 0 auto;
      padding: 20px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.06);
    }
    h1, h2 {
      margin: 0 0 14px;
    }
    h1 { font-size: 24px; }
    h2 { font-size: 18px; }
    input, select, button {
      box-sizing: border-box;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      font-size: 14px;
    }
    button {
      background: #111827;
      color: #fff;
      border: none;
      cursor: pointer;
      font-weight: 700;
    }
    button.secondary {
      background: #4b5563;
    }
    button.danger {
      background: #b91c1c;
    }
    button.light {
      background: #e5e7eb;
      color: #111827;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }
    .grid3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    .stat {
      background: #f3f4f6;
      border-radius: 12px;
      padding: 14px;
    }
    .stat b {
      font-size: 24px;
      display: block;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th, td {
      border-bottom: 1px solid #e5e7eb;
      padding: 9px;
      text-align: left;
      vertical-align: top;
    }
    th {
      background: #f9fafb;
      font-weight: 800;
    }
    .scroll {
      overflow-x: auto;
    }
    .hidden {
      display: none;
    }
    .msg {
      margin-top: 10px;
      padding: 10px;
      border-radius: 10px;
      background: #f3f4f6;
      white-space: pre-line;
    }
    .ok { background: #ecfdf5; color: #065f46; }
    .err { background: #fef2f2; color: #991b1b; }
    .warn { background: #fffbeb; color: #92400e; }
    .small {
      font-size: 12px;
      color: #6b7280;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    @media (max-width: 820px) {
      .grid, .grid3, .stats {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card" id="loginCard">
      <h1>근태 관리자</h1>
      <input type="password" id="adminPassword" placeholder="관리자 비밀번호">
      <button onclick="login()">로그인</button>
      <div id="loginMsg" class="msg hidden"></div>
      <p class="small">초기 비밀번호는 admin1234입니다. 반드시 Script Properties에서 변경하세요.</p>
    </div>

    <div id="adminArea" class="hidden">
      <div class="card">
        <h1>관리자 대시보드</h1>
        <div class="stats">
          <div class="stat">재직 인원 <b id="activeCount">0</b></div>
          <div class="stat">정상 출근 <b id="normalCount">0</b></div>
          <div class="stat">확인 필요 <b id="pendingCount">0</b></div>
          <div class="stat">미출근 추정 <b id="absentCount">0</b></div>
        </div>
      </div>

      <div class="card">
        <h2>사업장 설정</h2>
        <div class="grid3">
          <input id="SITE_NAME" placeholder="사업장명">
          <input id="BASE_LAT" placeholder="위도 예: 35.8714">
          <input id="BASE_LNG" placeholder="경도 예: 128.6014">
          <input id="ALLOWED_RADIUS_M" placeholder="허용 반경 m">
          <select id="GPS_REQUIRED">
            <option value="TRUE">GPS 필수</option>
            <option value="FALSE">GPS 비필수</option>
          </select>
          <input id="MAX_GPS_ACCURACY_M" placeholder="GPS 정확도 허용 m">
          <input id="CONSENT_VERSION" placeholder="동의서 버전 v1">
        </div>
        <div class="actions">
          <button onclick="saveConfig()">설정 저장</button>
          <button class="secondary" onclick="testTelegram()">텔레그램 테스트</button>
        </div>
      </div>

      <div class="card">
        <h2>직원 등록</h2>
        <div class="grid">
          <input id="newName" placeholder="성명">
          <input id="newDept" placeholder="부서">
          <input id="newTeam" placeholder="팀">
          <input id="newZone" placeholder="구역">
          <input id="newPin" placeholder="휴대폰 뒷자리 4자리" maxlength="4">
          <button onclick="addEmployee()">직원 등록</button>
        </div>
        <div class="small">직원은 직접 신규 등록하지 않고, 관리자가 먼저 등록하는 방식입니다.</div>
      </div>

      <div class="card">
        <h2>오늘 출근 현황</h2>
        <div class="scroll">
          <table id="todayTable"></table>
        </div>
      </div>

      <div class="card">
        <h2>날짜별 조회 / CSV 다운로드</h2>
        <div class="actions">
          <input id="searchDate" type="date">
          <button onclick="loadDate()">조회</button>
          <input id="startDate" type="date">
          <input id="endDate" type="date">
          <button onclick="downloadCsv()">CSV 다운로드</button>
          <button class="danger" onclick="cleanupOld()">1년 경과 데이터 정리</button>
        </div>
        <div class="scroll">
          <table id="dateTable"></table>
        </div>
      </div>

      <div class="card">
        <h2>직원 관리</h2>
        <div class="scroll">
          <table id="employeeTable"></table>
        </div>
      </div>

      <div id="adminMsg" class="msg hidden"></div>
    </div>
  </div>

  <script>
    let adminPassword = '';
    let latestData = null;

    function login() {
      adminPassword = document.getElementById('adminPassword').value;
      google.script.run
        .withSuccessHandler(function(res) {
          if (res.ok) {
            document.getElementById('loginCard').classList.add('hidden');
            document.getElementById('adminArea').classList.remove('hidden');
            loadAdminData();
          } else {
            showLoginMsg(res.message, 'err');
          }
        })
        .withFailureHandler(function(err) {
          showLoginMsg(err.message, 'err');
        })
        .adminLogin(adminPassword);
    }

    function loadAdminData() {
      google.script.run
        .withSuccessHandler(function(data) {
          latestData = data;
          renderDashboard(data);
        })
        .withFailureHandler(function(err) {
          showMsg(err.message, 'err');
        })
        .getAdminData(adminPassword);
    }

    function renderDashboard(data) {
      document.getElementById('activeCount').textContent = data.stats.active_count;
      document.getElementById('normalCount').textContent = data.stats.normal_count;
      document.getElementById('pendingCount').textContent = data.stats.pending_count;
      document.getElementById('absentCount').textContent = data.stats.absent_count;

      const cfg = data.config || {};
      ['SITE_NAME','BASE_LAT','BASE_LNG','ALLOWED_RADIUS_M','GPS_REQUIRED','MAX_GPS_ACCURACY_M','CONSENT_VERSION']
        .forEach(function(k) {
          if (document.getElementById(k)) document.getElementById(k).value = cfg[k] || '';
        });

      document.getElementById('searchDate').value = data.today;
      document.getElementById('startDate').value = data.today.slice(0, 7) + '-01';
      document.getElementById('endDate').value = data.today;

      renderAttendanceTable('todayTable', data.attendance_today || []);
      renderEmployeeTable(data.employees || []);
    }

    function renderAttendanceTable(id, rows) {
      const table = document.getElementById(id);
      const headers = ['출근일','시간','성명','부서','팀','구역','상태','GPS','거리','업무','관리'];
      let html = '<tr>' + headers.map(h => '<th>' + h + '</th>').join('') + '</tr>';

      rows.forEach(function(r) {
        html += '<tr>' +
          td(r.checkin_date) +
          td(r.checkin_time) +
          td(r.name_snapshot) +
          td(r.department_snapshot) +
          td(r.team_snapshot) +
          td(r.zone_snapshot) +
          td(r.status) +
          td(r.gps_result) +
          td(r.distance_from_site ? r.distance_from_site + 'm' : '') +
          td([r.work_default, r.work_detail].filter(Boolean).join(' / ')) +
          '<td><button class="light" onclick="changeAttendanceStatus(\'' + esc(r.attendance_id) + '\')">상태수정</button></td>' +
          '</tr>';
      });

      table.innerHTML = html;
    }

    function renderEmployeeTable(rows) {
      const table = document.getElementById('employeeTable');
      const headers = ['성명','부서','팀','구역','상태','PIN','입사일','퇴사일','관리'];
      let html = '<tr>' + headers.map(h => '<th>' + h + '</th>').join('') + '</tr>';

      rows.forEach(function(e) {
        html += '<tr>' +
          td(e.name) +
          td(e.department) +
          td(e.team) +
          td(e.zone) +
          td(e.status) +
          td(e.pin_registered) +
          td(e.joined_date) +
          td(e.resigned_date) +
          '<td><div class="actions">' +
            '<button class="light" onclick="editEmployee(\'' + esc(e.employee_id) + '\')">수정</button>' +
            '<button class="secondary" onclick="resetPin(\'' + esc(e.employee_id) + '\')">PIN변경</button>' +
            '<button class="danger" onclick="deactivateEmployee(\'' + esc(e.employee_id) + '\')">퇴사</button>' +
            '<button class="danger" onclick="hardDeleteEmployee(\'' + esc(e.employee_id) + '\')">완전삭제</button>' +
          '</div></td>' +
          '</tr>';
      });

      table.innerHTML = html;
    }

    function addEmployee() {
      const emp = {
        name: v('newName'),
        department: v('newDept'),
        team: v('newTeam'),
        zone: v('newZone'),
        phone_last4: v('newPin')
      };

      google.script.run
        .withSuccessHandler(function() {
          showMsg('직원을 등록했습니다.', 'ok');
          ['newName','newDept','newTeam','newZone','newPin'].forEach(id => document.getElementById(id).value = '');
          loadAdminData();
        })
        .withFailureHandler(function(err) { showMsg(err.message, 'err'); })
        .addEmployee(adminPassword, emp);
    }

    function editEmployee(employeeId) {
      const e = latestData.employees.find(x => x.employee_id === employeeId);
      if (!e) return;

      const name = prompt('성명', e.name);
      if (name === null) return;
      const department = prompt('부서', e.department || '');
      if (department === null) return;
      const team = prompt('팀', e.team || '');
      if (team === null) return;
      const zone = prompt('구역', e.zone || '');
      if (zone === null) return;
      const reason = prompt('수정 사유', '직원 정보 수정');
      if (reason === null) return;

      google.script.run
        .withSuccessHandler(function() {
          showMsg('직원 정보를 수정했습니다.', 'ok');
          loadAdminData();
        })
        .withFailureHandler(function(err) { showMsg(err.message, 'err'); })
        .updateEmployee(adminPassword, employeeId, {
          name: name,
          department: department,
          team: team,
          zone: zone,
          reason: reason
        });
    }

    function resetPin(employeeId) {
      const pin = prompt('새 휴대폰 뒷자리 4자리');
      if (pin === null) return;
      const reason = prompt('PIN 변경 사유', '휴대폰번호 변경 또는 관리자 초기화');
      if (reason === null) return;

      google.script.run
        .withSuccessHandler(function() {
          showMsg('PIN을 변경했습니다.', 'ok');
          loadAdminData();
        })
        .withFailureHandler(function(err) { showMsg(err.message, 'err'); })
        .updateEmployee(adminPassword, employeeId, {
          phone_last4: pin,
          reason: reason
        });
    }

    function deactivateEmployee(employeeId) {
      const reason = prompt('퇴사 처리 사유', '퇴사 처리');
      if (!reason) return;

      google.script.run
        .withSuccessHandler(function() {
          showMsg('퇴사 처리했습니다. 출근 화면에서 숨김 처리됩니다.', 'ok');
          loadAdminData();
        })
        .withFailureHandler(function(err) { showMsg(err.message, 'err'); })
        .deactivateEmployee(adminPassword, employeeId, reason);
    }

    function hardDeleteEmployee(employeeId) {
      if (!confirm('직원 마스터에서 완전 삭제합니다. 과거 출근 기록의 스냅샷은 남습니다. 계속할까요?')) return;
      const reason = prompt('완전 삭제 사유', '보관기간 경과 또는 관리자 정리');
      if (!reason) return;

      google.script.run
        .withSuccessHandler(function() {
          showMsg('직원 마스터에서 삭제했습니다.', 'ok');
          loadAdminData();
        })
        .withFailureHandler(function(err) { showMsg(err.message, 'err'); })
        .hardDeleteEmployee(adminPassword, employeeId, reason);
    }

    function changeAttendanceStatus(attendanceId) {
      const status = prompt('변경할 상태를 입력하세요: 정상 / 관리자확인필요 / 취소', '정상');
      if (!status) return;
      const reason = prompt('수정 사유');
      if (!reason) return;

      google.script.run
        .withSuccessHandler(function() {
          showMsg('출근 상태를 수정했습니다.', 'ok');
          loadAdminData();
          loadDate();
        })
        .withFailureHandler(function(err) { showMsg(err.message, 'err'); })
        .updateAttendanceStatus(adminPassword, attendanceId, status, reason);
    }

    function saveConfig() {
      const patch = {};
      ['SITE_NAME','BASE_LAT','BASE_LNG','ALLOWED_RADIUS_M','GPS_REQUIRED','MAX_GPS_ACCURACY_M','CONSENT_VERSION']
        .forEach(function(k) { patch[k] = document.getElementById(k).value; });

      google.script.run
        .withSuccessHandler(function() {
          showMsg('사업장 설정을 저장했습니다.', 'ok');
          loadAdminData();
        })
        .withFailureHandler(function(err) { showMsg(err.message, 'err'); })
        .updateSiteConfig(adminPassword, patch);
    }

    function testTelegram() {
      google.script.run
        .withSuccessHandler(function() { showMsg('텔레그램 테스트 요청을 보냈습니다.', 'ok'); })
        .withFailureHandler(function(err) { showMsg(err.message, 'err'); })
        .testTelegram(adminPassword);
    }

    function loadDate() {
      const d = document.getElementById('searchDate').value;
      if (!d) return showMsg('조회 날짜를 선택하세요.', 'err');

      google.script.run
        .withSuccessHandler(function(res) {
          renderAttendanceTable('dateTable', res.rows || []);
        })
        .withFailureHandler(function(err) { showMsg(err.message, 'err'); })
        .getAttendanceByDate(adminPassword, d);
    }

    function downloadCsv() {
      const start = document.getElementById('startDate').value;
      const end = document.getElementById('endDate').value;
      if (!start || !end) return showMsg('시작일과 종료일을 선택하세요.', 'err');

      google.script.run
        .withSuccessHandler(function(res) {
          const rows = res.rows || [];
          const headers = [
            'checkin_date','checkin_time','employee_id','name_snapshot','department_snapshot',
            'team_snapshot','zone_snapshot','work_default','work_detail','gps_lat','gps_lng',
            'gps_accuracy','distance_from_site','gps_result','pin_result','device_info','status','created_at'
          ];
          const csv = toCsv(headers, rows);
          const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'attendance_' + start + '_' + end + '.csv';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        })
        .withFailureHandler(function(err) { showMsg(err.message, 'err'); })
        .getAttendanceRange(adminPassword, start, end);
    }

    function cleanupOld() {
      if (!confirm('1년이 지난 출근/동의 기록을 삭제합니다. 계속할까요?')) return;

      google.script.run
        .withSuccessHandler(function(res) {
          showMsg(
            '정리 완료\n기준일: ' + res.cutoff +
            '\n출근 기록 삭제: ' + res.attendanceDeleted +
            '\n동의 기록 삭제: ' + res.consentDeleted,
            'ok'
          );
          loadAdminData();
        })
        .withFailureHandler(function(err) { showMsg(err.message, 'err'); })
        .cleanupOldRecords(adminPassword);
    }

    function toCsv(headers, rows) {
      const lines = [];
      lines.push(headers.join(','));
      rows.forEach(function(r) {
        lines.push(headers.map(function(h) {
          const value = r[h] == null ? '' : String(r[h]);
          return '"' + value.replace(/"/g, '""') + '"';
        }).join(','));
      });
      return lines.join('\n');
    }

    function td(v) {
      return '<td>' + escapeHtml(v == null ? '' : String(v)) + '</td>';
    }

    function v(id) {
      return document.getElementById(id).value.trim();
    }

    function esc(s) {
      return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function showLoginMsg(msg, type) {
      const box = document.getElementById('loginMsg');
      box.className = 'msg ' + type;
      box.classList.remove('hidden');
      box.textContent = msg;
    }

    function showMsg(msg, type) {
      const box = document.getElementById('adminMsg');
      box.className = 'msg ' + type;
      box.classList.remove('hidden');
      box.textContent = msg;
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }
  </script>
</body>
</html>
